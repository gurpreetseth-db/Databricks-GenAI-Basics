# -----------------------------------------------------------------------------
# BASE app.yaml — committed so `databricks bundle deploy` has a valid app spec.
# -----------------------------------------------------------------------------
# This holds only the start command + static, mode-independent env so the app
# can start in `simple` mode straight after `bundle deploy`.
#
# The full, mode-specific configuration (UC_CATALOG/SCHEMA, MODEL_ROUTE, GENIE,
# VECTOR_INDEX, and the Lakebase PG* vars for shortterm/longterm) is written by
# `deploy_app.py`, which uploads a complete app.yaml to the workspace copy and
# redeploys. It does NOT modify this file — values come from databricks.yml.
command:
  - uv
  - run
  - start-app
env:
  - name: MLFLOW_TRACKING_URI
    value: databricks
  - name: MLFLOW_REGISTRY_URI
    value: databricks-uc
  - name: API_PROXY
    value: http://localhost:8000/invocations
  - name: CHAT_APP_PORT
    value: "3000"
  - name: CHAT_PROXY_TIMEOUT_SECONDS
    value: "300"
  - name: MEMORY_MODE
    value: simple
